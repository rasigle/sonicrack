name: Engine Package

on:
  push:
  pull_request:

jobs:
  engine-package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run engine tests
        run: uv run --extra audio-io --extra midi pytest tests/engine -q

      - name: Run engine lint
        run: uv run ruff check src/engine src/audio_io src/midi_io tests/engine

      - name: Run engine type check
        run: uv run mypy src/engine src/audio_io src/midi_io

      - name: Build package
        run: uv build

      - name: Smoke test wheel install
        shell: bash
        run: |
          python -m venv .venv-smoke
          . .venv-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python - <<'PY'
          import importlib.util

          import src.engine as engine

          assert importlib.util.find_spec("sounddevice") is None
          assert importlib.util.find_spec("PyQt6") is None
          assert importlib.util.find_spec("src.audio_io") is not None
          assert importlib.util.find_spec("src.midi_io") is not None
          assert hasattr(engine, "SineOscillator")
          assert not hasattr(engine, "AudioOutput")

          osc = engine.SineOscillator(frequency=440)
          samples = osc.get_samples(16, mode="vectorized")
          assert samples.shape == (16,)
          PY
