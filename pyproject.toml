[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audioplayground"
dynamic = ["version"]
authors = [
    {name = "Rainer Sigle", email = "rainer.sigle@live.de"}
]
description = "Professional modular audio synthesis framework with visual patching interface and high-performance engine"
readme = "README.md"
license = {text = "MIT"}
keywords = ["audio", "synthesis", "modular", "synthesizer", "music", "sound-design", "dsp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2.6",
    "scipy",
    "sounddevice>=0.5.2", # Audio I/O
    "mido", # Midi-support
    "python-rtmidi>=1.5.8", # Midi I/O
    "librosa>=0.11.0", # Audio analysis
    "pyqt6", # GUI library
    # used in examples
    "pyqtgraph>=0.13.7",
    "notebook>=7.4.7",
    "pynput>=1.8.1",
    "matplotlib>=3.10.7",
    "pandas>=2.3.3",
    "pyaudio",
    "scipy-stubs~=1.16.3",
]

[dependency-groups]

"dev" = [
    # Linter
    "black[jupyter]",
    "flake8>=7.0.1",
    "pytest>=7.4.2",
    "pytest-cov>=4.1.0",

    # Testing
    "pytest",
    "pytest-html",
    "pytest-mock",
    "coverage",
    "pytest-cov",
]


[tool.ruff]

line-length = 88
indent-width = 4

target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E741" # Ambiguous variable name
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools.dynamic]
version = {attr = "_version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

