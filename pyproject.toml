[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audioplayground"
dynamic = ["version"]
authors = [
    {name = "Rainer Sigle", email = "rainer.sigle@live.de"}
]
description = "Modular audio synthesis framework with visual patching interface and high-performance audio engine"
readme = "README.md"
license = {text = "MIT"}
keywords = ["audio", "synthesis", "modular", "synthesizer", "music", "sound-design", "dsp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2.6",
    "scipy",
    "sounddevice>=0.5.2", # Audio I/O
    "pyqt6", # GUI library
    "scipy-stubs>=1.17.1.5",
]

[project.optional-dependencies]
# install with e.g.: uv sync --extra examples
midi = [
    "mido", # MIDI support is optional in code and only required for MIDI features
    "python-rtmidi>=1.5.8", # Common real-time MIDI backend for mido
]
examples = [
    "librosa>=0.11.0", # Example audio-analysis scripts/notebooks
    "matplotlib>=3.10.7", # Plotting in examples
    "pyaudio", # Live input in signal-analysis examples
    "pyqtgraph>=0.13.7", # Example visual analyzers
    "notebook>=7.4.7", # Jupyter notebooks in examples/
]
full = [
    "mido",
    "python-rtmidi>=1.5.8",
    "librosa>=0.11.0",
    "matplotlib>=3.10.7",
    "pyaudio",
    "pyqtgraph>=0.13.7",
    "notebook>=7.4.7",
]

[dependency-groups]

"dev" = [
    # Linter
    "black[jupyter]",
    "flake8>=7.0.1",
    "scipy-stubs~=1.17.1.5",

    # Testing
    "pytest>=7.4.2",
    "pytest-cov>=4.1.0",
    "pytest-html",
    "pytest-mock",
    "coverage",
]


[tool.ruff]

line-length = 88
indent-width = 4

target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E741" # Ambiguous variable name
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools.dynamic]
version = {attr = "_version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
