[project]
name = "synthplay"
authors = [
    {name = "Rainer Sigle", email = "rainer.sigle@live.de"}
]
description = "Just a playground for creating sounds with Python"

version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "scipy",
    "sounddevice>=0.5.2",
    "librosa>=0.11.0",
    "pyqt6",

    # used in examples
    "pyqtgraph>=0.13.7",
    "notebook>=7.4.7",
    "pynput>=1.8.1",
    "matplotlib>=3.10.7",
    "pandas>=2.3.3",
    "pyaudio",
]

[dependency-groups]

"dev" = [
    # Linter
    "black[jupyter]",
    "flake8>=7.0.1",
    "pytest>=7.4.2",
    "pytest-cov>=4.1.0",

    # Testing
    "pytest",
    "pytest-html",
    "pytest-mock",
    "coverage",
    "pytest-cov",
]



[tool.ruff]

line-length = 88
indent-width = 4

target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E741" # Ambiguous variable name
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
