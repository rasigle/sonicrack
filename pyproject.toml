[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sonicrack"
dynamic = ["version"]
authors = [
    {name = "Rainer Sigle", email = "rainer.sigle@live.de"}
]
description = "PyQt6 modular synthesizer rack"
readme = "README.md"
license = {text = "MIT"}
keywords = ["audio", "synthesis", "modular", "synthesizer", "music", "sound-design", "dsp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "scipy",
    "soniclab>=2026.1.0",
]

[project.scripts]
sonicrack = "sonicrack.modular_synth_app:main"

[project.optional-dependencies]
# install with e.g.: uv sync --extra examples
audio-io = [
    "sounddevice>=0.5.5", # Audio I/O
    "numba>=0.66.0",  # High-performance audio processing
]
gui = [
    "pyqt6", # GUI library
    "sonicrack[audio-io]",
]
midi = [
    "mido", # MIDI support is optional in code and only required for MIDI features
    "python-rtmidi>=1.5.8", # Common real-time MIDI backend for mido
]
examples = [
    "librosa>=0.11.0", # Example audio-analysis scripts/notebooks
    "matplotlib>=3.11.0", # Plotting in examples
    "pyaudio", # Live input in signal-analysis examples
    "pyqtgraph>=0.13.7", # Example visual analyzers
    "notebook>=7.4.7", # Jupyter notebooks in examples/
    "ipykernel>=7.3.0",
    "ipython>=9.15.0", # Interactive Python shell for examples
]
full = [
    "sonicrack[audio-io, gui, midi, examples]",
]

[dependency-groups]

"dev" = [
    # Linting
    "black[jupyter]",
    "flake8>=7.3.0",
    "ruff>=0.15.20",
    "pylint>=4.0.6",
    "pylint-json2html>=0.5.0",

    # Type checking
    "mypy>=2.2.0",
    "scipy-stubs>=1.17.1.5",

    # Testing
    "pytest>=7.4.2",
    "pytest-cov>=4.1.0",
    "pytest-html",
    "pytest-mock",
    "coverage>=7.15.0",
]


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "code"
path = "sonicrack/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["sonicrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # Pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "cr-lf"

[tool.mypy]
check_untyped_defs = false
disable_error_code = "annotation-unchecked"
exclude = [
    "^docs/test_scripts/",
    "^examples/",
]

[[tool.mypy.overrides]]
module = ["mido", "mido.*", "sounddevice", "sounddevice.*"]
ignore_missing_imports = true
