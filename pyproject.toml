[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sonicrack"
dynamic = ["version"]
authors = [
    {name = "Rainer Sigle", email = "rainer.sigle@live.de"}
]
description = "PyQt6 modular synthesizer rack"
readme = "README.md"
license = {text = "MIT"}
keywords = ["audio", "synthesis", "modular", "synthesizer", "music", "sound-design", "dsp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Typing :: Typed",
]

requires-python = ">=3.11"
# Desktop app: GUI + device audio ship in the base install so
# `uv tool install sonicrack` / `uv pip install sonicrack` + `sonicrack`
# works out of the box.
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.11",
    "soniclab>=2026.1.1",
    "pyqt6",
    "sounddevice>=0.5.5",
    "numba>=0.66.0",
]

[project.urls]
Homepage = "https://github.com/rasigle/sonicrack"
Repository = "https://github.com/rasigle/sonicrack"
Issues = "https://github.com/rasigle/sonicrack/issues"
Changelog = "https://github.com/rasigle/sonicrack/blob/main/CHANGELOG.md"

[project.scripts]
sonicrack = "sonicrack.modular_synth_app:main"

[project.optional-dependencies]
# Base install already includes the GUI and audio I/O stack.
# These extras remain for backward-compatible install commands.
gui = []
audio-io = []
midi = [
    "soniclab[midi]",
]
examples = [
    "librosa>=0.11.0",
    "matplotlib>=3.11.0",
    "pyaudio",  # may require system PortAudio headers on some platforms
    "pyqtgraph>=0.13.7",
    "notebook>=7.4.7",
    "ipykernel>=7.3.0",
    "ipython>=9.15.0",
]
full = [
    "sonicrack[midi, examples]",
]

[dependency-groups]

"dev" = [
    # Linting
    "black[jupyter]",
    "flake8>=7.3.0",
    "ruff>=0.15.20",
    "pylint>=4.0.6",
    "pylint-json2html>=0.5.0",

    # Type checking
    "mypy>=2.2.0",
    "scipy-stubs>=1.17.1.5",

    # Testing
    "pytest>=7.4.2",
    "pytest-cov>=4.1.0",
    "pytest-html",
    "pytest-mock",
    "coverage>=7.15.0",
]


[tool.hatch.version]
source = "code"
path = "sonicrack/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["sonicrack"]
exclude = [
    "sonicrack/resources/screenshots",
    "sonicrack/resources/screenshots/**",
    "sonicrack/resources/icons/generate_icon.py",
    "sonicrack/resources/splash/generate_splash.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "sonicrack",
    "tests",
    "examples",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
]
exclude = [
    "**/.pytest_cache",
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
    ".idea",
    ".github",
    "scripts",
    "docs",
    "uv.lock",
    "dist",
    "build",
    "sonicrack/resources/screenshots",
    "sonicrack/resources/screenshots/**",
    "sonicrack/resources/icons/generate_icon.py",
    "sonicrack/resources/splash/generate_splash.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # Pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "cr-lf"

[tool.mypy]
check_untyped_defs = false
disable_error_code = "annotation-unchecked"
exclude = [
    "^docs/test_scripts/",
    "^examples/",
]

[[tool.mypy.overrides]]
module = ["mido", "mido.*", "sounddevice", "sounddevice.*"]
ignore_missing_imports = true
